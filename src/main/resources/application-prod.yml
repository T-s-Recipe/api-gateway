server:
  port: 8000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: auth
              uri: lb://auth
              predicates:
                - Path=/auths/**
            - id: member
              uri: lb://member
              predicates:
                - Path=/members/**
            - id: recipe
              uri: lb://recipe
              predicates:
                - Path=/recipes/**

whitelist:
  service:
    - "auths"
  api:
    members:
      # 회원가입
      - method: POST
        path: "/"

      # 랜덤 닉네임
      - method: GET
        path: "/nickname"

      # 닉네임 중복 확인
      - method: GET
        path: "/nickname/check"
    recipes:
      # 최근 레시피 목록 조회 (메인 페이지)
      - method: GET
        path: "/recent"

      # 레시피 상세 조회
      - method: GET
        path: "/{recipeId}"

      # 레시피 검색
      - method: GET
        path: "/"
  swagger-path:
    - "/swagger-ui"
    - "/v3/api-docs"
    - "/swagger-resources"
    - "/webjars"

jwt:
  issuer: ${JWT_ISSUER}
  secret-key: ${JWT_SECRET}