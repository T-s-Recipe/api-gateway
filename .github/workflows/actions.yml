name: Build and Deploy Gateway

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            TAG="dev"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAG="prod"
          else
            TAG="latest"
          fi
          echo "Using tag: $TAG"

          docker build --build-arg JWT_SECRET=${{ secrets.JWT_SECRET }} -t ${{ secrets.DOCKER_USERNAME }}/${{ github.repository }}:$TAG .
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ github.repository }}:$TAG

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Kubernetes rollout restart
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          kubectl rollout restart deployment/${{ github.repository }}
          kubectl rollout status deployment/${{ github.repository }}
